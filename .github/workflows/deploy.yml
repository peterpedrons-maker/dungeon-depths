name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/criar-algo-9inrfg
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: Pages must be enabled once by hand (Settings -> Pages -> Source:
      # GitHub Actions). actions/configure-pages with enablement: true cannot do
      # it here — the workflow token gets "Resource not accessible by
      # integration" — and adding it only fails the build, so it is left out.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
