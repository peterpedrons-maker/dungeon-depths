name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/criar-algo-9inrfg
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: Pages must be enabled once by hand (Settings -> Pages -> Source:
      # GitHub Actions). actions/configure-pages with enablement: true cannot do
      # it here — the workflow token gets "Resource not accessible by
      # integration" — and adding it only fails the build, so it is left out.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # This is a monorepo of independent games under apps/<name>/. Every
      # game builds itself, then gets copied into the combined site output.
      # ROOT_APP keeps serving at the site root so its existing bookmarked
      # URL never changes; every other app is published under /<name>/.
      # Adding a new game later needs zero edits here — just add the folder.
      - name: Build every app and assemble the site
        run: |
          set -e
          ROOT_APP="dungeon-depths"
          mkdir -p site
          for dir in apps/*/; do
            name="$(basename "$dir")"
            echo "── Building $name ──"
            (cd "$dir" && npm ci && npm run build)
            if [ "$name" = "$ROOT_APP" ]; then
              cp -r "$dir/dist/." site/
            else
              mkdir -p "site/$name"
              cp -r "$dir/dist/." "site/$name/"
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
