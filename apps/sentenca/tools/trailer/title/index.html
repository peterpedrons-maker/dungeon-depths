<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:mdd;src:url(../../../public/fonts/mdd-pixel.otf)}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas><script>
const LOGO = [".oooooo...ooooooo..ooo...oo..oooooooo..ooooooo..ooo...oo....ooooo........rrr.....","oooooooo..ooooooo..oooo..oo..oooooooo..ooooooo..oooo..oo...ooooooo.......rrr.....","oo....oo..oo.......oooo..oo.....oo.....oo.......oooo..oo..oo....oo.......rrr.....","oo........oo.......oo.oo.oo.....oo.....oo.......oo.oo.oo..oo.............ggg.....","ooooooo...oooooo...oo.oo.oo.....oo.....oooooo...oo.oo.oo..oo............gg.gg....",".ooooooo..oooooo...oo..oooo.....oo.....oooooo...oo..oooo..oo............gg.gg....","......oo..oo.......oo..oooo.....oo.....oo.......oo..oooo..oo...........gg...gg...","......oo..oo.......oo...ooo.....oo.....oo.......oo...ooo..oo..........gg.....gg..","oo....oo..oo.......oo....oo.....oo.....oo.......oo....oo..oo....oo..yyyg.....gyyy","oooooooo..ooooooo..oo....oo.....oo.....ooooooo..oo....oo...ooooooo..yyygggggggyyy",".oooooo...ooooooo..oo....oo.....oo.....ooooooo..oo....oo....ooooo...yyygggggggyyy","..............................................................oo.................","...............................................................oo................","............................................................oooo................."];
const c = document.getElementById('c');
const g = c.getContext('2d');
g.imageSmoothingEnabled = false;
const R = LOGO.length, C = LOGO[0].length;
const S = Math.floor(1240 / C); // tamanho do pixel do logo
const X0 = Math.round((1920 - C * S) / 2), Y0 = 330;
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const noise = LOGO.map((r) => [...r].map(() => rnd())); // o grão da pedra, fixo por pixel
const dust = [...Array(70)].map(() => ({ x: 760 + rnd() * 400, y: rnd() * 1080, v: 6 + rnd() * 10, a: rnd() }));
const t0 = performance.now();
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const rgb = (a) => `rgb(${a[0]},${a[1]},${a[2]})`;
const STONE = [158, 150, 140], STONE_D = [92, 86, 82], GOLD = [255, 211, 107], GOLD_D = [214, 150, 60], EMBER = [255, 122, 46];
function frame() {
  const t = (performance.now() - t0) / 1000;
  g.fillStyle = '#000'; g.fillRect(0, 0, 1920, 1080);
  // o feixe frio de cima, com poeira (como a luz do poço)
  const beam = Math.min(1, Math.max(0, (t - 0.4) / 1.6)) * (t > 8.2 ? Math.max(0, 1 - (t - 8.2) / 1.2) : 1);
  const gr = g.createLinearGradient(0, 0, 0, 1080);
  gr.addColorStop(0, `rgba(150,160,190,${0.16 * beam})`); gr.addColorStop(1, 'rgba(150,160,190,0)');
  g.fillStyle = gr; g.beginPath(); g.moveTo(820, 0); g.lineTo(1100, 0); g.lineTo(1240, 1080); g.lineTo(680, 1080); g.closePath(); g.fill();
  for (const d of dust) {
    const y = (d.y + t * d.v) % 1080;
    g.fillStyle = `rgba(230,228,215,${(0.25 + 0.5 * d.a) * beam})`;
    g.fillRect(Math.round(d.x + Math.sin(t * 0.7 + d.a * 9) * 6), Math.round(y), 3, 3);
  }
  // o logo: a luz de ouro corre pelas letras da esquerda para a direita (1,2 s a 3,4 s); a pedra fica, com um fio de ouro que esfria
  const sweep = (t - 1.2) / 2.2; // 0..1 ao longo do logo
  const fade = t > 8.2 ? Math.max(0, 1 - (t - 8.2) / 1.2) : 1;
  for (let r = 0; r < R; r++) for (let q = 0; q < C; q++) {
    const ch = LOGO[r][q];
    if (ch === '.') continue;
    const xs = q / C;
    const since = (sweep - xs) * 2.2; // segundos desde que a luz passou aqui
    if (since < 0) continue;
    let col;
    if (ch === 'o') {
      const hot = Math.max(0, 1 - since / 0.9);
      const base = mix(STONE_D, STONE, 0.55 + 0.45 * noise[r][q] - (r > R * 0.6 ? 0.25 : 0));
      col = mix(base, GOLD, hot * 0.95);
    } else {
      // o triângulo do ACENDER e a brasa: acendem quando a luz chega neles e ficam de ouro, respirando
      const on = Math.min(1, since / 0.35);
      const br = 0.85 + 0.15 * Math.sin(t * 3.1 + q * 0.4);
      col = ch === 'r' ? mix([60, 20, 10], EMBER, on * (0.8 + 0.2 * Math.sin(t * 9 + r))) : mix([60, 40, 10], ch === 'y' ? GOLD : mix(GOLD_D, GOLD, br), on);
    }
    g.globalAlpha = fade;
    g.fillStyle = rgb(col);
    g.fillRect(X0 + q * S, Y0 + r * S, S, S);
    // o sulco: a sombra de baixo da pedra
    if (ch === 'o' && (r + 1 >= R || LOGO[r + 1][q] === '.')) { g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(X0 + q * S, Y0 + (r + 1) * S - Math.round(S / 4), S, Math.round(S / 4)); }
  }
  g.globalAlpha = 1;
  // o brilho do ACENDER (um halo quente atrás do triângulo)
  const tri = LOGO.map((row) => [...row].map((ch, q) => (ch === 'g' || ch === 'r' ? q : -1)).filter((q) => q >= 0)).flat();
  if (tri.length && sweep > 0.85) {
    const qx = X0 + ((Math.min(...tri) + Math.max(...tri)) / 2) * S, qy = Y0 + R * 0.45 * S;
    const k = Math.min(1, (sweep - 0.85) / 0.3) * (0.75 + 0.25 * Math.sin(t * 4)) * fade;
    const hg = g.createRadialGradient(qx, qy, 0, qx, qy, 260);
    hg.addColorStop(0, `rgba(255,170,70,${0.22 * k})`); hg.addColorStop(1, 'rgba(255,120,40,0)');
    g.fillStyle = hg; g.fillRect(qx - 260, qy - 260, 520, 520);
  }
  // a editora e o "em breve", em pedra clara com a letra do jogo
  const tx = Math.min(1, Math.max(0, (t - 4.3) / 0.9)) * fade;
  g.textAlign = 'center';
  g.fillStyle = `rgba(200,192,176,${tx})`;
  g.font = '44px mdd';
  g.fillText('EM BREVE', 960, Y0 + R * S + 150);
  g.fillStyle = `rgba(150,142,130,${tx * 0.9})`;
  g.font = '30px mdd';
  g.fillText('Cinco Riscos', 960, Y0 + R * S + 215);
  requestAnimationFrame(frame);
}
document.fonts.load('44px mdd').then(() => requestAnimationFrame(frame));
</script></body></html>
